[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "compare-competencies"
version = "3.0.0"
description = "Comparison of educational competencies with hh.ru job vacancies"
requires-python = ">=3.11"
dependencies = [
    # 0.162 сделал include_router ленивым (_IncludedRouter). Тесты это учитывают:
    # tests/conftest.py:open_all_gates обходит вложенные роутеры. Без этой
    # правки endpoint-тесты получают 401 вместо своих кодов.
    "fastapi>=0.162",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "prophet>=1.1",
    "prometheus-client>=0.19",
    "slowapi>=0.1",
    "structlog>=24.0",
    "httpx>=0.27",
    "sentence-transformers>=2.5",
    "matplotlib>=3.7",
    "scipy>=1.11",
    "tqdm>=4.66",
    "joblib>=1.3",
    "rank-bm25>=0.2",
    "hdbscan>=0.8",
    "shap>=0.44",
    "pymorphy3>=2.0",
    "pgvector>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "pytest-timeout>=2.3",
    "mypy>=1.10",
    "bandit>=1.7",
    "ruff>=0.11",
    "pre-commit>=4.0",
]

[project.scripts]
compare-competencies = "src.cli.__main__:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI: Depends(...) в значении по умолчанию — контракт, а не ошибка.
"src/api_pkg/routers/*.py" = ["B008"]
# Тесты: имена моков с большой буквы, распаковка в match, длинные фикстуры,
# импорты после патча sys.modules, вложенные with для моков.
"tests/**/*.py" = ["N806", "F841", "E501", "E402", "SIM117"]
# CLI и загрузчики: окружение (dotenv, кодировка консоли, sys.path) обязано
# быть настроено до импорта src — E402 здесь ожидаем.
"src/cli/*.py" = ["E402"]
"src/pipeline/teacher_analysis_runner.py" = ["E402"]
"src/pipeline/helpers.py" = ["E402"]
"src/loaders_student/student_loader.py" = ["E402"]
# ML: матрица признаков традиционно называется X.
"src/predictors/ltr_recommendation_engine.py" = ["N806"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.bandit]
exclude_dirs = ["tests", ".mimocode"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
# Parallel runs stay opt-in (`-n 4 --dist loadfile`): several suites hit the live
# PostgreSQL and fixed row keys, so `--dist load` and default parallelism are unsafe.
# The timeout guards against a hung worker turning a 9-minute run into 30+.
timeout = 300
timeout_method = "thread"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::pydantic.v1.deprecation.PydanticDeprecatedSince20",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration",
    "db: test writes to the live PostgreSQL database; run serially",
]

[tool.coverage.run]
omit = [
    "src/logging_config.py",
]

[tool.mypy]
python_version = "3.11"
strict = true
show_error_codes = true
warn_unused_ignores = true
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = [
    "pandas", "numpy", "matplotlib.*", "seaborn", "sklearn.*",
    "tqdm", "joblib", "pymorphy3", "rank_bm25", "requests",
    "hdbscan", "shap", "fastapi.*", "pydantic.*", "slowapi.*",
    "structlog",
]
