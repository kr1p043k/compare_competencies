[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "compare-competencies"
version = "3.0.0"
description = "Comparison of educational competencies with hh.ru job vacancies"
requires-python = ">=3.11"
dependencies = [
    # 0.162 сделал include_router ленивым (_IncludedRouter). Тесты это учитывают:
    # tests/conftest.py:open_all_gates обходит вложенные роутеры. Без этой
    # правки endpoint-тесты получают 401 вместо своих кодов.
    "fastapi>=0.162",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "prophet>=1.1",
    "prometheus-client>=0.19",
    "slowapi>=0.1",
    "structlog>=24.0",
    "httpx>=0.27",
    "sentence-transformers>=2.5",
    "matplotlib>=3.7",
    "scipy>=1.11",
    "tqdm>=4.66",
    "joblib>=1.3",
    "rank-bm25>=0.2",
    "hdbscan>=0.8",
    "shap>=0.44",
    "pymorphy3>=2.0",
    "pgvector>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "pytest-timeout>=2.3",
    "mypy>=1.10",
    "bandit>=1.7",
    "ruff>=0.11",
    "pre-commit>=4.0",
]

[project.scripts]
compare-competencies = "src.cli.__main__:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "SIM",
    # Расширенный набор (backlog 9.*): включён поэтапно, шумовые правила
    # вынесены в ignore с обоснованием - см. комментарии ниже.
    "C4", "PERF", "G", "PT", "PLR2004",
]

ignore = [
    # RUF001/002/003 - «неоднозначный юникод»: ruff ругается на кириллицу,
    # похожую на латиницу (с/c, А/A). В русскоязычном проекте это шум:
    # проверено токенайзером - во всём коде 21 идентификатор с кириллицей,
    # все в tests/api/test_export_injection.py (русские заголовки колонок
    # Excel, намеренно). Реальных опечаток нет.
    "RUF001", "RUF002", "RUF003",
    # PLC0415 - import вне верха модуля. В src это осознанно: ленивые импорты
    # torch/transformers (старт приложения) и разрыв циклов между роутерами.
    # Массовый перенос наверх замедлит старт и может сломать монтирование.
    "PLC0415",
    # PLR2004 - magic value: 300 мест в src (пороги, размеры батчей, лимиты).
    # Вынос в именованные константы - отдельная задача (backlog 9.1): часть
    # чисел читается на месте лучше (`if score > 0.5`), часть требует
    # домысливания имени. Включим, когда пройдём по модулям.
    "PLR2004",
    # PERF401/PERF403 - замена цикла на comprehension: 50 мест. Применение
    # спорно там, где тело цикла делает несколько действий или фильтрацию -
    # цикл читается лучше. Отдельная задача (backlog 9.2) с прогоном тестов.
    "PERF401", "PERF403",
    # G004 - f-string в логировании: 55 мест, появились при переводе print ->
    # logger (backlog 5.4). G004 защищает от вычисления строки, когда лог
    # отключён, но проект логирует через structlog, где это не даёт выигрыша.
    # Переход на структурные key=value - отдельная задача (backlog 9.3):
    # тексты с эмодзи и русскими фразами требуют осмысленных имён событий.
    "G004",
]

[tool.ruff.lint.per-file-ignores]
# FastAPI: Depends(...) в значении по умолчанию — контракт, а не ошибка.
"src/api_pkg/routers/*.py" = ["B008"]
# Тесты: имена моков с большой буквы, распаковка в match, длинные фикстуры,
# импорты после патча sys.modules, вложенные with для моков.
# PLR2004: в тестах литералы в ожиданиях - норма, не magic value.
# PT018: составной assert в тесте читается как одна проверка пары значений
# (`assert x["a"] == 1 and x["b"] == 2`); разбиение на два assert добавляет
# шум без диагностической выгоды - падение и так показывает строку.
"tests/**/*.py" = ["N806", "N803", "N812", "N814", "N817", "E741", "B017",
                    "F841", "E501", "E402", "SIM117", "PLR2004", "PT018"]
# Скрипты - разовые утилиты: числа в аргументах и проверках читаются как есть.
"scripts/**/*.py" = ["PLR2004", "PT018", "E402", "E501", "N801", "N802", "N803", "N806", "E741", "B005", "B007", "SIM102", "SIM108"]
# CLI и загрузчики: окружение (dotenv, кодировка консоли, sys.path) обязано
# быть настроено до импорта src — E402 здесь ожидаем.
"src/cli/*.py" = ["E402"]
"src/pipeline/teacher_analysis_runner.py" = ["E402", "E501", "N806"]
"src/pipeline/helpers.py" = ["E402"]
"src/loaders_student/student_loader.py" = ["E402"]
# ML: матрица признаков традиционно называется X.
"src/predictors/ltr_recommendation_engine.py" = ["N806", "N803", "C408", "PERF102", "C416"]
# Одноразовые скрипты/миграции: ML-конвенция (X, Y, Xtr), длинные метки, ASCII-выкладки.
"scripts/*.py" = ["E402", "E501", "N801", "N802", "N803", "N806", "E741", "B005", "B007", "SIM102", "SIM108"]
"alembic/*.py" = ["E402", "E501", "N801", "N806"]
"alembic/**/*.py" = ["E402", "E501", "N801", "N806"]
# Длинные SQL/регексп-строки (E501 не ставится на строки внутри литералов).
"src/api_pkg/routers/teacher.py" = ["E501"]
"src/api_pkg/routers/vacancies.py" = ["E501"]
"src/cli/fix_rpd_data.py" = ["E501"]
"src/loaders/rpd_skill_cleaner.py" = ["E501"]
"src/pipeline/background_collector.py" = ["E501"]
# Инструменты/бенчмарки: sys.path до импортов (E402).
"tools/*.py" = ["E402"]
"src/analyzers/trend_analyzer.py" = ["N806"]
"src/loaders/rpd_loader.py" = ["B005"]
# Файлы в работе у параллельных сессий: C416 (лишний list comprehension)
# поправим вместе с их правками, чтобы не создавать конфликт слияния.
"src/analyzers/academic_gap.py" = ["C416"]
# То же для остальных файлов, застолблённых на шине координации: их правят
# другие сессии, новые правила ruff применим после слияния их работы.
"src/analyzers/gap/profile_evaluator.py" = ["C401", "PERF102"]
"src/analyzers/skill_matcher.py" = ["C416"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.bandit]
exclude_dirs = ["tests", ".mimocode"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
# Parallel runs stay opt-in (`-n 4 --dist loadfile`): several suites hit the live
# PostgreSQL and fixed row keys, so `--dist load` and default parallelism are unsafe.
# The timeout guards against a hung worker turning a 9-minute run into 30+.
timeout = 300
timeout_method = "thread"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::pydantic.v1.deprecation.PydanticDeprecatedSince20",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration",
    "db: test writes to the live PostgreSQL database; run serially",
]

[tool.coverage.run]
omit = [
    "src/logging_config.py",
]

[tool.mypy]
python_version = "3.11"
strict = true
show_error_codes = true
warn_unused_ignores = true
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = [
    "pandas", "numpy", "matplotlib.*", "seaborn", "sklearn.*",
    "tqdm", "joblib", "pymorphy3", "rank_bm25", "requests",
    "hdbscan", "shap", "fastapi.*", "pydantic.*", "slowapi.*",
    "structlog",
]
