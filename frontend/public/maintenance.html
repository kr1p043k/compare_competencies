<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Технические работы</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1e3a5f 0%, #312e81 100%);
      color: #fff;
    }
    .card {
      text-align: center;
      max-width: 480px;
      padding: 48px 32px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      backdrop-filter: blur(4px);
    }
    .icon {
      font-size: 56px;
      margin-bottom: 16px;
    }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
    p { font-size: 15px; line-height: 1.6; color: rgba(255, 255, 255, 0.85); margin-bottom: 24px; }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔧</div>
    <h1>Извините, на сайте ведутся технические работы</h1>
    <p>Мы обновляем систему и скоро вернёмся. Пожалуйста, попробуйте зайти чуть позже.</p>
    <div class="spinner"></div>
  </div>
</body>
</html>
