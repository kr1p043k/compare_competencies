name: CI

on:
  push:
    # Рабочие ветки тоже проверяются: гейт только на main/master означал, что
    # вся работа в for_Nikita и auto/* шла без единой проверки и ломалась
    # незаметно. Полный набор patterns + явные ветки проекта.
    branches:
      - main
      - master
      - for_Nikita
      - "auto/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches: [main, master, for_Nikita]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install "ruff>=0.11.0"
      # Hard gate: syntax errors, undefined names, broken f-strings. These are
      # the rules whose violations mean the code cannot run at all.
      - name: Ruff (correctness)
        run: ruff check src tests scripts --select E9,F63,F7,F82
      # Advisory: the full rule set still reports ~1.7k stylistic findings
      # inherited from the existing tree. Visible, but not blocking, until the
      # backlog is burned down.
      - name: Ruff (full, advisory)
        continue-on-error: true
        run: ruff check src tests scripts --statistics

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      # Раньше фронтенд вообще не проверялся в CI: типобезопасность и тесты
      # жили только на машине разработчика.
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --reporter=basic
      - name: Build
        run: npm run build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r requirements-dev.txt
      # Одна голова и применимость на чистой БД: ошибка миграции всплывает
      # здесь, а не на деплое.
      - name: Single alembic head
        run: |
          heads=$(python -m alembic heads --resolve-dependencies | wc -l)
          if [ "$heads" -ne 1 ]; then
            echo "Expected exactly one alembic head, got $heads"
            python -m alembic heads
            exit 1
          fi
      - name: Upgrade from scratch
        run: python -m alembic upgrade heads
        env:
          DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/test
          SECRET_KEY: 0123456789abcdef0123456789abcdef

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # CPU-only torch keeps the job small; requirements.txt then treats
      # "torch>=2.5.0" as already satisfied instead of pulling CUDA wheels.
      - name: Install CPU torch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # Дрейф openapi.json ловится здесь: экспортёр пишет схему во временный
      # файл, и diff падает, если закоммиченный артефакт разошёлся с backend.
      # SECRET_KEY нужен только чтобы импортировать фабрику приложения
      # (src/config.py валидирует его при создании Settings), БД не требуется.
      - name: OpenAPI drift check
        run: |
          python scripts/export_openapi.py --output openapi.generated.json
          if ! diff -u openapi.json openapi.generated.json; then
            echo "openapi.json is out of date. Run: python scripts/export_openapi.py"
            exit 1
          fi
        env:
          SECRET_KEY: 0123456789abcdef0123456789abcdef
      # Measured on auto/night-ux: 69% (3281 passed, 94 skipped) after the
      # Course Trends client, normaliser and articles feed were added.
      # The floor tracks the measured value so a real regression fails the
      # build, while normal noise (new module without tests) does not.
      # Target is 70%; the gap is tracked in the coverage backlog.
      - name: Tests
        run: pytest tests -q --ignore=tests/load --cov=src --cov-report=term-missing --cov-fail-under=68
        env:
          DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/test
          HH_ACCESS_TOKEN: ""
          OPENAI_API_KEY: ""
      # Живой базы у раннера нет, поэтому проверка согласованности KRM<->БД
      # идёт только там, где задан секрет DATABASE_URL. Локально её гоняет
      # scripts/check_krm_db_consistency.py.
      # Важно: контекст secrets НЕДОСТУПЕН в if-условиях — GitHub из-за этого
      # вообще не парсит workflow (все прогоны CI падали с 0 джобов).
      # Поэтому секрет подкладываем в env, а проверку делаем в shell.
      - name: KRM/DB consistency (if a database is configured)
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL is not configured, skipping"
            exit 0
          fi
          python scripts/check_krm_db_consistency.py --direction 09.03.02 --year 2025 --dsn "$DATABASE_URL"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Диагностика, а не гейт: расхождение установленных версий с пинами
      # уже один раз маскировалось под баг в коде (aiohttp 3.14.4 против
      # 3.12.14 ломал aioresponses). Печатаем, чтобы причина была видна.
      - name: Dependency drift (advisory)
        continue-on-error: true
        run: python scripts/check_dependency_drift.py
