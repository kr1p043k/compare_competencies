name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install "ruff>=0.11.0"
      # Hard gate: syntax errors, undefined names, broken f-strings. These are
      # the rules whose violations mean the code cannot run at all.
      - name: Ruff (correctness)
        run: ruff check src tests scripts --select E9,F63,F7,F82
      # Advisory: the full rule set still reports ~1.7k stylistic findings
      # inherited from the existing tree. Visible, but not blocking, until the
      # backlog is burned down.
      - name: Ruff (full, advisory)
        continue-on-error: true
        run: ruff check src tests scripts --statistics

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # CPU-only torch keeps the job small; requirements.txt then treats
      # "torch>=2.5.0" as already satisfied instead of pulling CUDA wheels.
      - name: Install CPU torch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # Measured on this branch: 63% (2663 passed, 94 skipped). The floor is
      # 3 points below so normal noise does not fail the build, while a real
      # coverage regression still does.
      - name: Tests
        run: pytest tests -q --ignore=tests/load --cov=src --cov-report=term-missing --cov-fail-under=60
        env:
          DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/test
          HH_ACCESS_TOKEN: ""
          OPENAI_API_KEY: ""
