name: Загрузка тестов

on:
  # schedule временно отключён: nightly падал каждый день на устаревших шагах
  # (docker-compose v1, apt-key, отсутствующий .env). Вернуть cron после
  # зелёного ручного прогона.
  # schedule:
  #   - cron: '0 4 * * *'  # каждую ночь в 4 утра МСК
  workflow_dispatch:

# SLO-константы: единый источник порогов для шага "Check thresholds" и
# теста-синхронизации tests/test_load_test_slo.py (thresholds в k6-скрипте
# обязаны совпадать с этими значениями).
env:
  SLO_ERROR_RATE: "0.05"   # допустимая доля failed-запросов (rate)
  SLO_P95_MS: "500"        # допустимая p95-длительность запроса, мс
  SLO_CHECKS_RATE: "0.95"  # минимальная доля passed checks

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Start services
        run: docker-compose up -d
      
      - name: Wait for API
        run: |
          until curl -s http://localhost:8000/api/health; do
            sleep 5
          done
      
      - name: Install k6
        run: |
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      - name: Run load test
        # k6 сам падает с кодом 99 при нарушении thresholds в скрипте -
        # это основной гейт. --summary-export пишет итоговый JSON-отчёт.
        run: |
          mkdir -p tests/load/reports
          k6 run tests/load/k6_script.js --summary-export=tests/load/reports/results.json
      
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: tests/load/reports/
      
      - name: Check thresholds
        run: |
          # Вторичный fail-closed гейт: если метрики нет или формат изменился,
          # выходим с кодом 1 и шаг падает. Пороги берутся из env SLO_*
          # (верх файла). Новый формат summary-export пишет .rate, старый - .value.
          REPORT=tests/load/reports/results.json
          if [ ! -f "$REPORT" ]; then
            echo "results.json not found"
            exit 1
          fi

          # Ошибки: http_req_failed rate <= SLO_ERROR_RATE.
          ERROR_RATE=$(jq -r '.metrics.http_req_failed.rate // .metrics.http_req_failed.value // empty' "$REPORT")
          if [ -z "$ERROR_RATE" ] || [ "$ERROR_RATE" = "null" ]; then
            echo "http_req_failed metric missing in $REPORT (SLO_ERROR_RATE=$SLO_ERROR_RATE)"
            exit 1
          fi
          echo "http_req_failed rate: $ERROR_RATE (SLO: <= $SLO_ERROR_RATE)"
          if (( $(echo "$ERROR_RATE > $SLO_ERROR_RATE" | bc -l) )); then
            echo "FAIL: error rate $ERROR_RATE exceeds SLO_ERROR_RATE=$SLO_ERROR_RATE"
            exit 1
          fi

          # Латентность: http_req_duration p(95) <= SLO_P95_MS мс.
          # k6 пишет ключ "p(95)"; в старых версиях встречался "p(95.0)".
          P95_MS=$(jq -r '.metrics.http_req_duration["p(95)"] // .metrics.http_req_duration["p(95.0)"] // empty' "$REPORT")
          if [ -z "$P95_MS" ] || [ "$P95_MS" = "null" ]; then
            echo "http_req_duration p(95) metric missing in $REPORT (SLO_P95_MS=$SLO_P95_MS)"
            exit 1
          fi
          echo "http_req_duration p(95): $P95_MS ms (SLO: <= $SLO_P95_MS ms)"
          if (( $(echo "$P95_MS > $SLO_P95_MS" | bc -l) )); then
            echo "FAIL: p95 latency $P95_MS ms exceeds SLO_P95_MS=$SLO_P95_MS ms"
            exit 1
          fi

          # Checks: если отчёт содержит метрику checks, доля passed >= SLO_CHECKS_RATE.
          CHECKS_RATE=$(jq -r '.metrics.checks.rate // .metrics.checks.value // empty' "$REPORT")
          if [ -n "$CHECKS_RATE" ] && [ "$CHECKS_RATE" != "null" ]; then
            echo "checks rate: $CHECKS_RATE (SLO: >= $SLO_CHECKS_RATE)"
            if (( $(echo "$CHECKS_RATE < $SLO_CHECKS_RATE" | bc -l) )); then
              echo "FAIL: checks rate $CHECKS_RATE below SLO_CHECKS_RATE=$SLO_CHECKS_RATE"
              exit 1
            fi
          else
            echo "checks metric absent from report; checks SLO skipped"
          fi