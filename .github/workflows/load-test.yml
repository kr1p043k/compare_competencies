name: Загрузка тестов

on:
  # schedule временно отключён: nightly падал каждый день на устаревших шагах
  # (docker-compose v1, apt-key, отсутствующий .env). Вернуть cron после
  # зелёного ручного прогона.
  # schedule:
  #   - cron: '0 4 * * *'  # каждую ночь в 4 утра МСК
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Start services
        run: docker-compose up -d
      
      - name: Wait for API
        run: |
          until curl -s http://localhost:8000/api/health; do
            sleep 5
          done
      
      - name: Install k6
        run: |
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      - name: Run load test
        # k6 сам падает с кодом 99 при нарушении thresholds в скрипте -
        # это основной гейт. --summary-export пишет итоговый JSON-отчёт.
        run: |
          mkdir -p tests/load/reports
          k6 run tests/load/k6_script.js --summary-export=tests/load/reports/results.json
      
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: tests/load/reports/
      
      - name: Check thresholds
        run: |
          # Вторичный fail-closed гейт: если метрики нет или формат изменился,
          # на выходе 1 и шаг падает. Новый формат summary-export пишет .rate,
          # старый писал .value.
          if [ ! -f tests/load/reports/results.json ]; then
            echo "results.json not found"
            exit 1
          fi
          ERROR_RATE=$(jq -r '.metrics.http_req_failed.rate // .metrics.http_req_failed.value // 1' tests/load/reports/results.json)
          echo "http_req_failed rate: $ERROR_RATE"
          if (( $(echo "$ERROR_RATE > 0.05" | bc -l) )); then
            echo "Error rate too high: $ERROR_RATE"
            exit 1
          fi