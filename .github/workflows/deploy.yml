name: Deploy (manual)

# ОСНОВНОЙ деплой идёт не отсюда.
#
# Сервер стоит за провайдерским NAT: на интерфейсе 10.131.65.30, «публичный»
# 95.174.102.182 — общий egress хостера, входящий SSH есть только через
# Tailscale. GitHub-hosted раннер до сервера не достучится (проверено:
# dial tcp 95.174.102.182:22 — i/o timeout), а Tailscale-ключ для CI истёк.
#
# Поэтому деплой запускает сам сервер: systemd-таймер cc-autodeploy.timer раз в
# 5 минут сравнивает выкаченный коммит с origin/main и вызывает
# scripts/deploy.sh (см. deploy/README.md, журнал: logs/autodeploy.log).
#
# Этот workflow остаётся ручным запасным вариантом: он сработает, если у сервера
# появится доступный извне SSH (тогда задайте секрет SSH_HOST_PUBLIC или
# верните шаг tailscale/github-action с новым TAILSCALE_AUTH_KEY).
on:
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST_PUBLIC }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 45m
          script_stop: true
          script: |
            set -e
            DIR=/home/admin_server/compare_competencies
            if [ -f "$DIR/scripts/deploy.sh" ]; then
              cp "$DIR/scripts/deploy.sh" /tmp/cc-deploy.sh
            else
              cd "$DIR"
              git fetch origin main --quiet
              git show origin/main:scripts/deploy.sh > /tmp/cc-deploy.sh
            fi
            bash /tmp/cc-deploy.sh
